        "<div>unresolved assets: <b>" + list.length + "</b></div>" +
        "<div>update source: " + ORIGIN + "</div>" +
        "<div>bootstrap rev: " + BOOT_REV + "</div><hr>" +
        (list.length
          ? list.map(function (m) {
              return "<div style='margin-bottom:8px;word-break:break-all'>" +
                "requested: " + m.requested + "<br>normalized: " + m.normalized +
                "<br>filename: " + m.name + "<br>in package: NO (no stored blob)" +
                "<br>rendered as: original URL (network)</div>";
            }).join("")
          : "<div>all requested assets resolved from local storage ✔</div>");
      d.querySelector("button").onclick = function () { d.remove(); };
      document.body.appendChild(d);
    }
    window.ACHOTIKALA_DIAGNOSTICS = show;
    var hot = document.createElement("div");
    hot.style.cssText = "position:fixed;bottom:0;inset-inline-start:0;width:38px;height:38px;z-index:2147483500";
    hot.title = "אבחון";
    var timer = null;
    hot.addEventListener("pointerdown", function () { timer = setTimeout(show, 1500); });
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (e) {
      hot.addEventListener(e, function () { clearTimeout(timer); });
    });
    document.body.appendChild(hot);
    if (qs.get("diag") === "1") setTimeout(show, 1500);
  }

  function mount(app, version) {
    var doc = new DOMParser().parseFromString(app.html, "text/html");
    document.documentElement.setAttribute("lang", doc.documentElement.getAttribute("lang") || "he");
    document.documentElement.setAttribute("dir", doc.documentElement.getAttribute("dir") || "rtl");
    var t = doc.querySelector("title");
    if (t) document.title = t.textContent;

    window.ACHOTIKALA_OFFLINE_HOST = true;
    window.ACHOTIKALA_OFFLINE = true;
    window.ACHOTIKALA_APP_VERSION = version;

    Array.prototype.forEach.call(doc.head.children, function (el) {
      var tag = el.tagName.toLowerCase();
      if (tag === "title" || tag === "script") return;
      document.head.appendChild(document.importNode(el, true));
    });

    // גיליונות עיצוב שלא מקושרים ישירות מה-HTML (הטוען הישן של האפליקציה הזריק אותם)
    var linked = {};
    Array.prototype.slice.call(document.head.querySelectorAll('link[rel="stylesheet"]')).forEach(function (l) {
      linked[l.getAttribute("href")] = 1;
    });
    Object.keys(app.urlMap).forEach(function (p) {
      if (!/\.css$/i.test(p) || linked[app.urlMap[p]]) return;
      var l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = app.urlMap[p];
      document.head.appendChild(l);
    });

    installResolver(app);

    var scripts = [];
    Array.prototype.slice.call(doc.body.children).forEach(function (el) {
      if (el.tagName.toLowerCase() === "script") { scripts.push(el); return; }
      document.body.appendChild(document.importNode(el, true));
    });
    Array.prototype.slice.call(doc.head.querySelectorAll("script")).forEach(function (el) { scripts.unshift(el); });

    function runNext(i) {
      if (i >= scripts.length) return Promise.resolve();
      var src = scripts[i].getAttribute("src");
      var s = document.createElement("script");
      if (scripts[i].type) s.type = scripts[i].type;
      if (!src) {
        s.textContent = scripts[i].textContent;
        document.body.appendChild(s);
        return runNext(i + 1);
      }
      // המנגנון הישן של העדכונים בתוך האפליקציה אינו רץ יותר — הקובץ הזה אחראי לעדכונים.
      var origPath = null;
      for (var p in app.urlMap) if (app.urlMap[p] === src) origPath = p;
      if (!origPath && src.indexOf("blob:") !== 0) origPath = src.replace(/^\.?\//, "").split("?")[0];
      if (origPath === "bootstrap.js" || origPath === "boot-core.js") {
        if (!app.urlMap["app.js"]) return runNext(i + 1);
        src = app.urlMap["app.js"];
      } else if (src.indexOf("blob:") !== 0) {
        // קובץ שאינו חלק מהחבילה (למשל update-config.js הישן) — מדלגים
        if (!app.urlMap[origPath]) return runNext(i + 1);
        src = app.urlMap[origPath];
      }
      return new Promise(function (res) {
        s.onload = s.onerror = function () { res(); };
        s.src = src;
        document.body.appendChild(s);
      }).then(function () { return runNext(i + 1); });
    }
    return runNext(0).then(function () {
      boxEl.parentNode && boxEl.parentNode.removeChild(boxEl);
    });
  }

  /* ---------------- זרימה ראשית ---------------- */
  var db;
  openDb().then(function (d) {
    db = d;
    return Promise.all([get(db, META, "current"), get(db, META, "previous"), get(db, META, "boot")]);
  }).then(function (r) {
    var current = r[0], previous = r[1], boot = r[2] || {};

    // גיבוי אוטומטי: אם הגרסה הנוכחית נכשלה פעמיים בפתיחה — חזרה לגרסה הקודמת
    if (current && previous && boot.version === current.version && !boot.verified && (boot.attempts || 0) >= 2) {
      current = previous; previous = null;
      return Promise.all([put(db, META, "current", current), del(db, META, "previous"),
        put(db, META, "boot", { version: current.version, attempts: 1, verified: true })])
        .then(function () { return start(current, null); });
    }

    if (current) {
      var attempts = boot.version === current.version ? (boot.attempts || 0) + 1 : 1;
      var verified = boot.version === current.version ? !!boot.verified : false;
      return put(db, META, "boot", { version: current.version, attempts: attempts, verified: verified })
        .then(function () { return start(current, previous); });
    }
    return firstRun();
  }).catch(function (e) {
    say("לא הצלחנו לפתוח את האתר");
    fail("שגיאה: " + (e && e.message ? e.message : e) +
      "<br>נסי לפתוח את הקובץ שוב, ואם זה חוזר — יש צורך בחיבור לאינטרנט לפתיחה הראשונה.");
  });

  function firstRun() {
    say("מתקינה את האתר במחשב לפעם הראשונה…");
    return loadManifest(20000).then(function (manifest) {
      return downloadMissing(db, manifest, function (d, t) {
        progress(d, t);
        say("מורידה את תוכן האתר…");
      }).then(function () {
        return Promise.all([
          put(db, META, "current", manifest),
          put(db, META, "boot", { version: manifest.version, attempts: 1, verified: false })
        ]);
      }).then(function () {
        say("כמעט מוכן…");
        return start(manifest, null);
      });
    }).catch(function (e) {
      say("ההתקנה הראשונה נכשלה");
      var d = e && e.detail;
      var rows = "";
      if (d) {
        rows =
          "<div style='text-align:start;direction:ltr;background:#faf6f8;border-radius:10px;padding:12px;margin-top:12px;font-size:12px;word-break:break-all'>" +
          "<div><b>stage:</b> " + (d.stage || "") + "</div>" +
          "<div><b>url:</b> " + (d.url || "") + "</div>" +
          "<div><b>file:</b> " + (d.file || "") + "</div>" +
          "<div><b>status:</b> " + (d.status !== undefined ? d.status : "(no response)") + "</div>" +
          "<div><b>content-type:</b> " + (d.contentType || "") + "</div>" +
          "<div><b>expected bytes:</b> " + (d.expectedBytes !== undefined ? d.expectedBytes : "") + "</div>" +
          (d.gotBytes !== undefined ? "<div><b>got bytes:</b> " + d.gotBytes + "</div>" : "") +
          (d.contentLength ? "<div><b>content-length:</b> " + d.contentLength + "</div>" : "") +
          (d.error ? "<div><b>error:</b> " + d.error + "</div>" : "") +
          "</div>";
      } else {
        rows = "<div style='margin-top:10px;font-size:13px'>שלב: טעינת רשימת העדכונים (manifest.js) — " +
          ORIGIN + "/updates/manifest.js</div>";
      }
      fail("לא הצלחנו להוריד את האתר כרגע (" + (e.message || e) + ")." + rows +
        "<div style='margin-top:10px'>צלמי את המסך הזה ושלחי אותו.</div>");
    });
  }

  function start(manifest, previous) {
    return buildApp(db, manifest).then(function (app) {
      return mount(app, manifest.version).then(function () { installDiagnostics(manifest, app); });
    }).then(function () {
      setTimeout(function () {
        put(db, META, "boot", { version: manifest.version, attempts: 0, verified: true });
      }, 4000);
      setTimeout(function () { checkForUpdate(manifest, previous); }, 2500);
    }).catch(function (e) {
      // הגרסה הנוכחית לא ניתנת להרכבה — ניסיון מיידי בגרסה הקודמת
      if (previous) {
        return Promise.all([put(db, META, "current", previous), del(db, META, "previous")])
          .then(function () { return start(previous, null); });
      }
      say("לא הצלחנו לפתוח את האתר");
      fail("שגיאה: " + (e && e.message ? e.message : e));
    });
  }

  function checkForUpdate(current, previous) {
    // התקנה ישנה ללא תמונות — מעדכנים מיד, עם התקדמות גלויה, ופותחים מחדש לבד
    var stale = (current.stage || "core") !== MIN_STAGE;
    loadManifest(20000).then(function (remote) {
      if (!remote || (remote.version <= current.version && !stale)) return;
      if (stale) toast("מורידה את התמונות של האתר… 0%");
      return downloadMissing(db, remote, function (d, t) {
        if (stale && t) toast("מורידה את התמונות של האתר… " + Math.round((d / t) * 100) + "%");
      }).then(function () {
        return Promise.all([
          put(db, META, "previous", current),
          put(db, META, "current", remote)
        ]);
      }).then(function () {
        return gc(db, [remote, current]);
      }).then(function () {
        put(db, META, "bootRev", BOOT_REV);
        if (stale) {
          toast("העדכון הותקן — פותחת מחדש…");
          setTimeout(function () { location.reload(); }, 1500);
        } else {
          toast("עדכון חדש הותקן ומוכן", "פתחי מחדש", function () { location.reload(); });
        }
      });
    }).catch(function (e) {
      window.ACHOTIKALA_UPDATE_ERROR = e && (e.detail || e.message || String(e));
      if (stale) toast("לא הצלחנו להוריד את התמונות כרגע — ננסה שוב בפתיחה הבאה");
    });
  }
})();
</script>
</body>
</html>
